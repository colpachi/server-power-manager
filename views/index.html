<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Power Manager</title>
    <style>
        h1 {
            grid-column: 1 / -1; /* Stretch across all columns */
            text-align: center;
            color: rgb(11, 5, 68);
        }
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(206, 206, 206);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 800px;
            padding: 20px;
            background: rgb(206, 206, 206);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .server {
            display: flex;
            flex-direction: column;
            padding: 1em;
        }
        .server input, .server button {
            margin-bottom: 5px;
        }
        button {
            cursor: pointer;
            background-color: #0a06e9;
            color: white;
            border: 0px;
            padding: 0.5em;
            border-radius: 2px;
            font-weight: bold;
        }
        .clear-btn{
            background-color: rgb(4, 192, 167);
        }
        .pause-btn {
            background-color: rgb(230, 150, 20);
        }
        .pause-btn.paused {
            background-color: rgb(180, 180, 180);
        }
        .status-message {
            color: blue; 
            font-weight: bold;
            width: 150px;
            height: 25px;
        }
        .weekdays {
            display: flex;
            gap: 4px;
            margin-top: 5px;
            font-size: 11px;
            align-items: center;
        }
        .weekdays label {
            cursor: pointer;
            user-select: none;
        }
    </style>
    <script src="jquery.min.js"></script>
    <script src="jquerymask.js"></script>

</head>

        async function clearForm(serverDiv, serverNumber) {
            
            const serverNameInput = document.getElementById(`serverName${serverNumber}`);
            const formInput = document.getElementById(`ipv4-${serverNumber}`);
            const usernameInput = document.getElementById(`username${serverNumber}`);
            const passwordInput = document.getElementById(`password${serverNumber}`);
            const powerOnTimeInput = document.getElementById(`powerOnTime${serverNumber}`);
            const powerOffTimeInput = document.getElementById(`powerOffTime${serverNumber}`);
            const statusMessageDiv = serverDiv.querySelector(".status-message");
            const startButton = document.getElementById(`start-${serverNumber}`);
            startButton.value = "Start";
            startButton.style.backgroundColor = '#0a06e9';

            // Uncheck all weekdays
            const weekdaysDiv1 = document.getElementById(`weekdays-${serverNumber}`);
            if (weekdaysDiv1) {
                weekdaysDiv1.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            }

            // Reset pause button
            const pauseBtn1 = document.getElementById(`pause-${serverNumber}`);
            if (pauseBtn1) {
                pauseBtn1.textContent = 'Pause';
                pauseBtn1.classList.remove('paused');
            }

            
            if (serverNameInput) serverNameInput.value = "";
            if (formInput) formInput.value = "";
            if (usernameInput) usernameInput.value = "";
            if (passwordInput) passwordInput.value = "";
            if (powerOnTimeInput) powerOnTimeInput.value = "";
            if (powerOffTimeInput) powerOffTimeInput.value = "";
            if (statusMessageDiv) statusMessageDiv.textContent = "";

            try {
                const response = await fetch(`/schedule/delete/${serverNumber}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();
                console.log("Resposta de exclusão:", data);

                if (!data.success) {
                    console.error('Falha ao deletar agendamento:', data.message);
                    if (statusMessageDiv) statusMessageDiv.textContent = "Erro ao deletar.";
                    return;
                }
               
            } catch (error) {
                console.error("Erro ao deletar agendamento:", error);
            }
        }


        $(document).ready(function() {

                async function clearForm(serverDiv, serverNumber) {
        serverDiv.querySelector("#serverName" + serverNumber).value = "";
        serverDiv.querySelector(".form-input").value = "";
        serverDiv.querySelector("input[type='text'][name*='username']").value = "";
        serverDiv.querySelector("input[type='password']").value = "";
        serverDiv.querySelector("input[type='time'][name*='PowerOnTime']").value = "";
        serverDiv.querySelector("input[type='time'][name*='PowerOffTime']").value = "";
        serverDiv.querySelector(".status-message").textContent = "";

        // Uncheck all weekdays
        const weekdaysDiv2 = serverDiv.querySelector('.weekdays');
        if (weekdaysDiv2) {
            weekdaysDiv2.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        }

        // Reset pause button
        const pauseBtn2 = serverDiv.querySelector('.pause-btn');
        if (pauseBtn2) {
            pauseBtn2.textContent = 'Pause';
            pauseBtn2.classList.remove('paused');
        }

        try {
            const response = await fetch(`/schedule/delete/${serverNumber}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                }
            });

            const data = await response.json();
            console.log("Resposta de exclusão:", data);

            if (!data.success) {
                console.error('Falha ao deletar agendamento:', data.message);
                serverDiv.querySelector(".status-message").textContent = "Erro ao deletar.";
                return;
            }

            serverDiv.querySelector(".status-message").textContent = "Agendamento deletado.";
        } catch (error) {
            console.error("Erro ao deletar agendamento:", error);
            serverDiv.querySelector(".status-message").textContent = "Erro ao deletar.";
        }
    }

            $(".form-input").inputmask({
                alias: "ip",
                greedy: false
            });

            fetch('/schedules')
                .then(response => response.json())
                .then(data => {
                    if (data.schedules && data.schedules.length > 0) {

                        console.log(data.schedules);

                        data.schedules.forEach((schedule, index) => {
                            
                            const serverNumber = index + 1;
                            const serverNameInput = document.getElementById(`serverName${serverNumber}`);
                            const serverIpInput = document.getElementById(`ipv4-${serverNumber}`);
                            const usernameInput = document.getElementById(`username${serverNumber}`);
                            const passwordInput = document.getElementById(`password${serverNumber}`);
                            const powerOnTimeInput = document.getElementById(`powerOnTime${serverNumber}`);
                            const powerOffTimeInput = document.getElementById(`powerOffTime${serverNumber}`);
                            const startButton = document.getElementById(`start-${serverNumber}`);
                            
                            if (serverNameInput) serverNameInput.value = schedule.server_name || "";
                            if (serverIpInput) serverIpInput.value = schedule.server_ip || "";
                            if (usernameInput) usernameInput.value = schedule.username || "";
                            if (passwordInput) passwordInput.value = schedule.password || "";
                            if (powerOnTimeInput) powerOnTimeInput.value = schedule.power_on_time || "";
                            if (powerOffTimeInput) powerOffTimeInput.value = schedule.power_off_time || "";

                            // Restore weekdays checkboxes
                            if (schedule.days_of_week) {
                                const wdDiv = document.getElementById(`weekdays-${serverNumber}`);
                                if (wdDiv) {
                                    const days = schedule.days_of_week.split(',');
                                    wdDiv.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                                        cb.checked = days.includes(cb.value);
                                    });
                                }
                            }


                            // Update button state based on schedule status
                            if (schedule.status === 'active') {
                                startButton.textContent = 'Running';
                                startButton.style.backgroundColor = '#0acda2';
                            }

                            // Restore pause button state
                            const pauseBtn = document.getElementById(`pause-${serverNumber}`);
                            if (pauseBtn) {
                                if (schedule.status === 'paused') {
                                    pauseBtn.textContent = 'Resume';
                                    pauseBtn.classList.add('paused');
                                } else {
                                    pauseBtn.textContent = 'Pause';
                                    pauseBtn.classList.remove('paused');
                                }
                            }

                            
                        });
                    }
                })
                .catch(error => console.error('Erro ao buscar agendamentos:', error));
        });

        async function toggleServer(serverDiv, serverNumber, button) {
            const isStarting = button.textContent === 'Start';

            const serverName = document.getElementById(`serverName${serverNumber}`).value;
            const serverIp = document.getElementById(`ipv4-${serverNumber}`).value;
            const username = document.getElementById(`username${serverNumber}`).value;
            const password = document.getElementById(`password${serverNumber}`).value;
            const powerOnTime = document.getElementById(`powerOnTime${serverNumber}`).value;
            const powerOffTime = document.getElementById(`powerOffTime${serverNumber}`).value;
            const statusMessageDiv = serverDiv.querySelector(".status-message");

            // Collect selected weekdays
            const weekdaysDiv = document.getElementById(`weekdays-${serverNumber}`);
            let days_of_week = '';
            if (weekdaysDiv) {
                const checked = weekdaysDiv.querySelectorAll('input[type="checkbox"]:checked');
                days_of_week = Array.from(checked).map(cb => cb.value).join(',');
            }

            if (!serverName || !serverIp || !username || !password || (!powerOnTime && !powerOffTime)) {
                statusMessageDiv.textContent = "Please fill all fields.";
                return;
            }

            const serverData = {
                id: serverNumber,
                server_name: serverName,
                server_ip: serverIp,
                username: username,
                password: password,
                power_on_time: powerOnTime,
                power_off_time: powerOffTime,
                days_of_week: days_of_week,
            };

            console.log("Enviando dados:", serverData);

            try {
                const response = await fetch('/schedule', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(serverData),
                });

                const data = await response.json();
                console.log("Resposta recebida:", data);

                if (!data.success) {
                    statusMessageDiv.textContent = data.message || "Action failed";
                    throw new Error(data.message || "Action failed");
                }

                button.textContent = isStarting ? 'Running' : 'Start';
                button.style.backgroundColor = isStarting ? '#0acda2' : '#0a06e9';
                statusMessageDiv.textContent = isStarting ? "Host acessível" : "";

                // Reset pause state when starting
                if (isStarting) {
                    const pauseBtn3 = document.getElementById(`pause-${serverNumber}`);
                    if (pauseBtn3) {
                        pauseBtn3.textContent = 'Pause';
                        pauseBtn3.classList.remove('paused');
                    }
                }
            } catch (error) {
                console.error("Erro ao realizar ação:", error);
                button.textContent = 'Start';
                button.style.backgroundColor = '#0a06e9';
            }
        }

        async function togglePause(serverNumber) {
            const pauseBtn = document.getElementById(`pause-${serverNumber}`);
            const isPaused = pauseBtn.classList.contains('paused');
            const newStatus = isPaused ? 'active' : 'paused';

            try {
                const response = await fetch(`/schedule/${serverNumber}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus }),
                });
                const data = await response.json();
                if (data.success) {
                    if (newStatus === 'paused') {
                        pauseBtn.textContent = 'Resume';
                        pauseBtn.classList.add('paused');
                    } else {
                        pauseBtn.textContent = 'Pause';
                        pauseBtn.classList.remove('paused');
                    }
                }
            } catch (error) {
                console.error('Erro ao alterar status:', error);
            }
        }
    </script>
</body>
</html>
